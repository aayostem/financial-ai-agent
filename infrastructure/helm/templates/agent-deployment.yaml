{{- if .Values.agentPool.enabled }}
---
# Agent Pool — Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: {{ .Values.agentPool.replicaCount }}
  selector:
    matchLabels:
      {{- include "financial-ai-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: agent
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  template:
    metadata:
      labels:
        {{- include "financial-ai-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: agent
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- include "financial-ai-agent.podAnnotations" (dict "Values" .Values "componentAnnotations" (default dict .Values.agentPool.podAnnotations)) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "financial-ai-agent.fullname" . }}-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "financial-ai-agent.image" (dict "global" .Values.global "image" .Values.agentPool.image) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          ports:
            - name: health
              containerPort: 8001
              protocol: TCP
          env:
            {{- range $k, $v := .Values.agentPool.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- with .Values.agentPool.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.agentPool.resources | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.agentPool.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.agentPool.readinessProbe | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /app/.cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-cache
          emptyDir:
            medium: Memory
            sizeLimit: 500Mi
---
# Agent Pool — internal Service
apiVersion: v1
kind: Service
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    {{- include "financial-ai-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  ports:
    - name: health
      port: 8001
      targetPort: health
      protocol: TCP
---
# Agent Pool — ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "financial-ai-agent.fullname" . }}-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "financial-ai-agent.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/financial-ai-agent
{{- end }}